# =====================================================================
# Rebuilds content/index.json whenever the Markdown content changes.
#
# This is what makes "drop a .md file into content/projects/ and it
# appears on the site" work without anybody running a command.
# =====================================================================

name: Build content index

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - '!content/index.json'
      - 'scripts/build-content-index.mjs'
      - 'assets/js/frontmatter.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate content/index.json
        run: node scripts/build-content-index.mjs

      - name: Commit the result if it changed
        run: |
          if git diff --quiet -- content/index.json; then
            echo "Index already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/index.json
          git commit -m "chore: rebuild content index"
          git push
