<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">

  <title>STEM People — Planetary science, astronomy and technology</title>

  <meta name="description"
        content="Research and field work in planetary sciences, astronomy and technology by Mery, STEM researcher.">
  <meta name="theme-color" content="#0b0a09">

  <meta property="og:type" content="website">
  <meta property="og:title" content="STEM People">
  <meta property="og:description"
        content="Research and field work in planetary sciences, astronomy and technology.">
  <meta property="og:image" content="img/mery-avatar.jpg">

  <link rel="icon" href="img/mery-avatar.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">

  <link rel="stylesheet" href="assets/css/main.css">
</head>

<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <!-- ============================================================
       BACKGROUND: star canvas + drifting nebula clouds
       ============================================================ -->

  <canvas class="starfield" data-starfield aria-hidden="true"></canvas>

  <div class="nebula" aria-hidden="true">
    <span class="nebula__cloud nebula__cloud--1"></span>
    <span class="nebula__cloud nebula__cloud--2"></span>
    <span class="nebula__cloud nebula__cloud--3"></span>
    <span class="nebula__grid"></span>
  </div>

  <audio id="ambient-audio" loop preload="none"></audio>

  <!-- ============================================================
       MOBILE TOP BAR
       ============================================================ -->

  <header class="topbar">
    <a class="topbar__brand" href="#/">
      <span class="topbar__mark" aria-hidden="true">✦</span>
      STEM<span>People</span>
    </a>

    <button class="burger" type="button" data-drawer-toggle
            aria-expanded="false" aria-label="Open navigation">
      <span></span><span></span><span></span>
    </button>
  </header>

  <div class="drawer-backdrop" data-drawer-backdrop></div>

  <!-- ============================================================
       SIDEBAR
       ============================================================ -->

  <aside class="sidebar" id="sidebar">

    <div class="sidebar__inner">

      <a class="brand" href="#/">
        <span class="brand__mark" aria-hidden="true">✦</span>
        <span>STEM<strong>People</strong></span>
      </a>

      <div data-profile></div>

      <div class="search">
        <input class="search__input" type="search" data-search
               placeholder="Search the work" aria-label="Search the work"
               autocomplete="off">
        <div class="search__results" data-search-results hidden></div>
      </div>

      <nav class="nav" data-nav aria-label="Main"></nav>

      <div class="sidebar__foot">
        <button class="audio" type="button" data-audio-toggle aria-pressed="false">
          <span class="audio__wave" aria-hidden="true">
            <i></i><i></i><i></i><i></i>
          </span>
          <span data-audio-label>Ambient off</span>
        </button>

        <p class="sidebar__note">
          © <span id="year"></span> STEM People ·
          <a href="#/privacy">Privacy</a>
        </p>
      </div>

    </div>

  </aside>

  <!-- ============================================================
       CONTENT
       ============================================================ -->

  <main class="main" id="main" data-main>
    <div class="boot">
      <span class="boot__ring" aria-hidden="true"></span>
      <p>Aligning instruments…</p>
    </div>
  </main>

  <!-- ============================================================
       LIGHTBOX
       ============================================================ -->

  <div class="lightbox" data-lightbox hidden role="dialog" aria-modal="true"
       aria-label="Enlarged image">
    <button class="lightbox__close" type="button" data-lightbox-close
            aria-label="Close image">×</button>
    <figure>
      <img src="" alt="">
      <figcaption></figcaption>
    </figure>
  </div>

  <!-- ============================================================
       COOKIE CONSENT

       Only shown when an analytics ID is configured in
       content/site.json and the visitor has not answered yet.
       ============================================================ -->

  <div class="consent" data-consent hidden role="region"
       aria-label="Cookie preferences">
    <p class="consent__text">
      This site can use Google Analytics cookies to count visits. Nothing is
      loaded until you choose. See the
      <a href="#/privacy">privacy note</a>.
    </p>
    <div class="consent__actions">
      <button class="btn btn--small" type="button" data-consent-reject>
        Reject
      </button>
      <button class="btn btn--small btn--primary" type="button" data-consent-accept>
        Accept
      </button>
    </div>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

  <script type="module" src="assets/js/app.js"></script>

  <noscript>
    <p style="padding:2rem;color:#fff">
      This site needs JavaScript to display its content.
      The articles themselves are plain Markdown files inside the
      <code>content/</code> folder of the repository.
    </p>
  </noscript>

</body>

</html>
