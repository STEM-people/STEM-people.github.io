<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi Página Personal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .hidden {
      display: none;
    }

    #planetary-submenu {
      margin-left: 20px;
    }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <!-- Columna izquierda -->
      <div class="col-md-3 left-column d-flex flex-column align-items-center text-center">
        <img src="img/STEMmery.jpg".jpg" alt="Mi foto" class="profile-img">
        <div class="contact-info mt-3">
          <p><strong>Nombre:</strong> Mery Ruiz</p>
          <p><strong>Email:</strong> mariaruizcontact@gmail.com</p>
          
        </div>
        <div class="project-menu">
          <h5>Proyectos</h5>
          <a href="#" onclick="toggleSubmenu(); loadContent('planetary_sciences/index.html', 'Planetary Sciences')">Planetary Sciences</a>
          <div id="planetary-submenu" class="hidden">
                <a href="#" onclick="loadContent('planetary_sciences/mars/index.html', 'Mars Works')">↳ Mars Works</a>
          </div>
          <a href="#" onclick="loadContent('technology/index.html', 'Technology')">Technology</a>
          <a href="#" onclick="loadContent('proyecto3.html', '')">Proyecto 3</a>
        </div>
      </div>

      <!-- Columna derecha -->
      <div class="col-md-9 content-area">
        <h2 id="content-title">Bienvenido</h2>
        <div id="main-content">
          <p>Selecciona un proyecto desde el menú de la izquierda para ver más detalles.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    function loadContent(page, title) {
      fetch(page)
        .then(response => response.text())
        .then(data => {
          document.getElementById('main-content').innerHTML = data;
          document.getElementById('content-title').innerText = title;
        })
        .catch(error => {
          document.getElementById('main-content').innerHTML = '<p>Error cargando el contenido.</p>';
          console.error('Error:', error);
        });
    }

</body>
</html>
  </script>
<script>
function toggleSubmenu() {
    const submenu = document.getElementById('planetary-submenu');
    submenu.classList.toggle('hidden');
}
</script>
