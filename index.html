<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>STEM People</title>
  <style>
    .hidden { display: none; }
    #planetary-submenu { margin-left: 20px; }
  </style>
</head>
<body>

  <div class="project-menu">
    <h5>Proyectos</h5>

    <a href="#" onclick="toggleSubmenu(); loadContent('planetary_sciences/index.html', 'Planetary Sciences')">
      Planetary Sciences
    </a>
    <div id="planetary-submenu" class="hidden">
      <a href="#" onclick="loadContent('planetary_sciences/mars/index.html', 'Mars Works')">↳ Mars Works</a>
    </div>

    <a href="#" onclick="loadContent('technology/index.html', 'Technology')">Technology</a>
    <a href="#" onclick="loadContent('proyecto3.html', '')">Proyecto 3</a>
  </div>

  <div id="content">
    <!-- Aquí se cargará el contenido con loadContent -->
  </div>

  <script>
    function toggleSubmenu() {
      const submenu = document.getElementById('planetary-submenu');
      submenu.classList.toggle('hidden');
    }

    function loadContent(url, title) {
      fetch(url)
        .then(response => response.text())
        .then(html => {
          document.getElementById('content').innerHTML = html;
        })
        .catch(err => {
          console.error('Error cargando:', err);
        });
    }

    // Cargar por defecto Planetary Sciences
    loadContent('planetary_sciences/index.html', 'Planetary Sciences');
  </script>

</body>
</html>
