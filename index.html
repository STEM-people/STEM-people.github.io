<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi Página Personal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .profile-img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 50%;
    }
    .left-column {
      min-height: 100vh;
      background-color: #ffffff;
      border-right: 1px solid #dee2e6;
      padding: 2rem;
    }
    .contact-info {
      margin-top: 1.5rem;
      font-size: 0.95rem;
    }
    .project-menu {
      margin-top: 2rem;
    }
    .project-menu a {
      display: block;
      margin: 0.5rem 0;
      text-decoration: none;
      color: #007bff;
    }
    .project-menu a:hover {
      text-decoration: underline;
    }
    .content-area {
      padding: 2rem;
    }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <!-- Columna izquierda -->
      <div class="col-md-3 left-column d-flex flex-column align-items-center text-center">
        <img src="img/STEMmery.jpg".jpg" alt="Mi foto" class="profile-img">
        <div class="contact-info mt-3">
          <p><strong>Nombre:</strong> Mery Ruiz</p>
          <p><strong>Email:</strong> mariaruizcontact@gmail.com</p>
          
        </div>
        <div class="project-menu">
          <h5>Proyectos</h5>
          <a href="#" onclick="loadContent('planetary_sciences/index.html', 'Planetary Sciences')">Planetary Sciences</a>
          <a href="#" onclick="loadContent('technology/index.html', 'Technology')">Technology</a>
          <a href="#" onclick="loadContent('proyecto3.html', '')">Proyecto 3</a>
        </div>
      </div>

      <!-- Columna derecha -->
      <div class="col-md-9 content-area">
        <h2 id="content-title">Bienvenido</h2>
        <div id="main-content">
          <p>Selecciona un proyecto desde el menú de la izquierda para ver más detalles.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    function loadContent(page, title) {
      fetch(page)
        .then(response => response.text())
        .then(data => {
          document.getElementById('main-content').innerHTML = data;
          document.getElementById('content-title').innerText = title;
        })
        .catch(error => {
          document.getElementById('main-content').innerHTML = '<p>Error cargando el contenido.</p>';
          console.error('Error:', error);
        });
    }
  </script>
</body>
</html>
