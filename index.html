<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>STEM People</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">

  <style>
    .hidden {
      display: none;
    }

    #planetary-submenu,
    #technology-submenu,
    #astronomy-submenu {
      margin-left: 20px;
    }

  .page-credit {
    margin: 2rem auto 0;
    padding: 0.8rem 1rem;
    max-width: 850px;
    border-top: 1px solid #ddd;
    font-size: 0.82rem;
    line-height: 1.5;
    text-align: center;
    color: #666;
  }

  .page-credit strong {
    color: #444;
  }

  </style>
  
</head>

<body>

  <div class="container-fluid">

    <div class="row">

      <!-- LEFT COLUMN -->
      <div class="col-md-3 left-column">

        <div class="text-center">

          <img src="img/STEMmery.jpg"
               alt="Profile Picture"
               class="profile-img mb-3">

          <h4>Mery</h4>

          <p class="text-muted">
            STEM Researcher
          </p>

        </div>

        <div class="contact-info">

          <p>
            <strong>Email:</strong>
            tu@email.com
          </p>

          <p>
            <strong>Location:</strong>
            Ciudad, País
          </p>

        </div>

        <div class="project-menu">

          <h5>Projects</h5>

          <!-- PLANETARY SCIENCES -->

          <a href="#"
             onclick="toggleSubmenu('planetary-submenu'); loadContent('planetary_sciences/index.html'); return false;">
            Planetary Sciences
          </a>

          <div id="planetary-submenu" class="hidden">

            <a href="#"
               onclick="loadContent('planetary_sciences/mars/index.html'); return false;">
              ↳ Mars Works
            </a>

          </div>


          <!-- TECHNOLOGY -->

          <a href="#"
             onclick="toggleSubmenu('technology-submenu'); loadContent('technology/index.html'); return false;">
            Technology
          </a>

          <div id="technology-submenu" class="hidden">

            <a href="#"
               onclick="loadContent('technology/media/index.html'); return false;">
              ↳ Androids
            </a>

          </div>


          <!-- ASTRONOMY -->

          <a href="#"
             onclick="toggleSubmenu('astronomy-submenu'); loadContent('astronomy/index.html'); return false;">
            Astronomy
          </a>

          <div id="astronomy-submenu" class="hidden">

            <a href="#"
               onclick="loadContent('astronomy/eclipse-2026/index.html'); return false;">
              ↳ Eclipse 2026
            </a>

          </div>

        </div>

      </div>


      <!-- RIGHT COLUMN -->

      <div class="col-md-9 content-area">

        <div id="content">
        </div>

      </div>

    </div>

  </div>


  <script>

    function toggleSubmenu(submenuId) {

      const submenu = document.getElementById(submenuId);

      submenu.classList.toggle('hidden');

    }


    function loadContent(url) {

      fetch(url)

        .then(response => {

          if (!response.ok) {
            throw new Error("Could not load " + url);
          }

          return response.text();

        })

        .then(html => {

          const content = document.getElementById('content');
          content.innerHTML = html;
          
          const pageCredit = document.createElement('div');
          pageCredit.className = 'page-credit';
          pageCredit.innerHTML = `
            <strong>Contenido protegido y sujeto a mantenimiento:</strong>
            Los contenidos de <em>STEM-people</em> se mantienen y actualizan periódicamente.
            En cualquier caso, cuando se utilicen contenidos, imágenes, datos o materiales
            de esta página, se solicita mencionar <strong>STEM-people</strong> como fuente
            e incluir la dirección web correspondiente.
          `;

          content.appendChild(pageCredit);

        })

        .catch(error => {

          console.error(error);

          document.getElementById('content').innerHTML =
            "<p>Error loading the content.</p>";

        });

    }


    // Load Planetary Sciences by default

    loadContent('planetary_sciences/index.html');

  </script>

</body>

</html>
