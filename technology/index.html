<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Technology</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    h1 {
      color: #2c3e50;
      border-bottom: 2px solid #3498db;
      padding-bottom: 10px;
    }
    .project-list {
      margin-top: 30px;
    }
    .project-item {
      margin: 15px 0;
      padding: 15px;
      background-color: #f8f9fa;
      border-left: 4px solid #3498db;
      border-radius: 4px;
      transition: background-color 0.3s;
    }
    .project-item:hover {
      background-color: #e9ecef;
    }
    .project-item h3 {
      margin: 0 0 10px 0;
      color: #2c3e50;
    }
    .project-item p {
      margin: 0;
      color: #666;
    }
    .project-link {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 15px;
      background-color: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      transition: background-color 0.3s;
    }
    .project-link:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>
  <h1>The technology hospital</h1>
  <p>Repairs</p>
  
  <div class="project-list">
    <!-- Mobiles -->
    <div class="project-item">
      <h3>🔴 Androids repairs</h3>
      <p>Hardware solutions for your Android</p>
      <a href="#" onclick="parent.loadContent('technology/index.html', 'Androids'); return false;" class="project-link">
        See examples →
      </a>
      <div class="container text-center">
      <img src="technology/media/movil_1.jpg" alt="Mi foto 1" class="standard-img">
      <img src="technology/media/movil_2.jpg" alt="Mi foto 2" class="standard-img">
      </div>
    </div>

    <!-- Puedes agregar más planetas/proyectos aquí -->

      <h3>🪐 Saturn</h3>
      <p>Estudios sobre Saturno y sus anillos.</p>
      <a href="#" onclick="parent.loadContent('planetary_sciences/saturn/index.html', 'Saturn Works'); return false;" class="project-link">
        Ver proyectos de Saturn →
      </a>
    </div>
    -->
  </div>
</body>
</html>
